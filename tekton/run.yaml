apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: cd-pipeline-run-
spec:
  pipelineRef:
    name: cd-pipeline
  params:
    - name: repo-url
      value: https://github.com/MuhammadHussain2004/zntwk-tax_calculator.git
    - name: branch-name
      value: main
    - name: image-name
      value: us.icr.io/<your-icr-namespace>/tax-calculator:latest
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
